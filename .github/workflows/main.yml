name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Branch to deploy (e.g., main, master, gh-pages)'
        required: true
        default: 'master'

jobs:
  make-public:
    runs-on: ubuntu-latest
    steps:
      - name: Make repository public
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |

          if [ "$priv" = "true" ]; then
             echo "Making repository public..."
              gh repo edit --repo "$REPO" --visibility public --accept-visibility-change-consequences || {
              echo "Error: Failed to make the repository public."
                exit 1
              }
          else
              echo "Repo is already public."
          fi

  deploy-pages:
    needs: make-public
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Debug workspace 
        run: | 
         echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" 
         pwd ls -la find . -maxdepth 3 -name package.json -print
      - name: Install dependencies
        run: npm install
        working-directory: ${{ github.workspace }}

      - name: Build site
        run: npm run build

      # Upload the static site content for Pages. Change "path" if your site lives elsewhere (e.g., ./public or ./dist)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          # If your site is in a different folder, set it here, e.g.:
          # path: ./public
          # path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
