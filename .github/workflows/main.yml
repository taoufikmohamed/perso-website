name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Branch to deploy (e.g., main, master, gh-pages)'
        required: true
        default: 'master'

jobs:
  make-public:
    runs-on: ubuntu-latest
    steps:
      - name: Make repository public
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |

          if [ "$priv" = "true" ]; then
             echo "Making repository public..."
              gh repo edit --repo "$REPO" --visibility public --accept-visibility-change-consequences || {
              echo "Error: Failed to make the repository public."
                exit 1
              }
          else
              echo "Repo is already public."
          fi

  deploy-pages:
    needs: make-public
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (for static site generators, optional)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Add your build step here if needed (e.g., npm install/build)
      # - name: Build Site
      #   run: npm install && npm run build

      - name: Upload static site to GitHub Pages
        uses: actions/configure-pages@v5

# Only one configure-pages step needed, and enablement should be true
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      
      # Ensure upload-pages-artifact points to the correct build output
      - name: Install dependencies
        run: npm install
      
      - name: Build site
        run: npm run build
      
      - name: Archive artifact
        run: tar -czf public.tar.gz ./public
      
      # Deploy using deploy-pages action (if preferred)
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4


